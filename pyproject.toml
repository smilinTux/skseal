[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skseal"
version = "0.1.0"
description = "Sovereign document signing — PGP-backed, legally binding, no middleman."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "smilinTux.org", email = "hello@smilintux.org"},
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pgpy>=0.6,<1.0",
    # pgpy imports imghdr, which Python 3.13 removed from the stdlib.
    "standard-imghdr>=3.13; python_version >= '3.13'",
    "pypdf>=6.21.4,<7.0",
    "click>=8.0,<9.0",
    "rich>=13.0,<15.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27",
    # The API takes form uploads (fastapi.Form / UploadFile).
    "python-multipart>=0.0.9",
    "aiofiles>=23.0,<26.0",
]

[project.optional-dependencies]
pkcs11 = [
    "PyKCS11>=1.5.12",
]
skcomms = [
    # SealSKCommsTransport (signing requests over SKComms).
    "skcomms>=0.2",
]
timestamp = [
    "rfc3161ng>=2.1",
    "asn1crypto>=1.5",
]
all = [
    "skcomms>=0.2",
    "PyKCS11>=1.5.12",
    "rfc3161ng>=2.1",
    "asn1crypto>=1.5",
]
dev = [
    "skcomms>=0.2",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "black>=23.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://smilintux.org"
Repository = "https://github.com/smilinTux/skseal"
Issues = "https://github.com/smilinTux/skseal/issues"

[project.scripts]
skseal = "skseal.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skseal = ["ui/*.html", "ui/*.js", "ui/*.css"]
