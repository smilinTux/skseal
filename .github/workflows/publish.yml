name: Publish to PyPI and npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Trusted Publishing (OIDC) on PyPI for this project:
#   owner=smilinTux  repo=skseal  workflow=publish.yml  environment=pypi
# No PyPI token is stored anywhere. Tests gate PRs in CI; a release only
# needs to build cleanly and pass `twine check`.
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    # Own gate: `build` must succeed. (main had `needs: test` + `if: always()`,
    # which published to npm even when tests failed; the test job is gone here
    # because tests gate PRs in ci.yml.)
    needs: build
    runs-on: ubuntu-latest
    # npm trusted publishing (OIDC): no stored token; provenance is signed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.5.1 or newer (trusted publishing)
        run: npm install -g npm@^11.5.1
      - name: Publish to npm
        run: npm publish --provenance --access public
